      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    networks:
      - parcel-net
    ports:
      - "9092:9092"        # accès depuis Windows
      - "29092:29092"      # accès depuis les conteneurs Docker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # LISTENERS internes + externes
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  spark-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-processor
    depends_on:
      - kafka
    networks:
      - parcel-net
    ports:
      - "4041:4040"
    volumes:
      - ./consumer.py:/app/consumer.py
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./jars:/app/jars
      - ./wait-for-it.sh:/app/wait-for-it.sh
    command: >
      bash -c "/app/wait-for-it.sh kafka:29092 --timeout=60 --strict -- && \
      spark-submit --master local[*] \
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 \
      /app/consumer.py"

  spark-notebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-notebook
    depends_on:
      - kafka
    networks:
      - parcel-net
    ports:
      - "8888:8888"
      - "4042:4040"

    # --- FIX BEGINS HERE ---
    # 1. Set the working directory to the mounted volume (owned by jovyan)
    working_dir: /home/jovyan/work

    volumes:
      # 2. Map your current host folder (.) to that specific directory
      - .:/home/jovyan/work
      - ./wait-for-it.sh:/app/wait-for-it.sh

    # 3. Environment variable to help Jupyter know where to look
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      NOTEBOOK_DIR: "/home/jovyan/work"
    # -----------------------

    command: >
      bash -lc "/app/wait-for-it.sh kafka:29092 --timeout=60 --strict -- && \
      start-notebook.sh --NotebookApp.token='' --NotebookApp.notebook_dir='/home/jovyan/work'"

  producer:
    image: python:3.11
    container_name: producer
    depends_on:
      - kafka
    networks:
      - parcel-net
    environment:
      KAFKA_HOST: kafka:29092
    volumes:
      - ./producer.py:/app/producer.py
      - ./wait-for-it.sh:/app/wait-for-it.sh
    working_dir: /app
    command: >
      bash -c "/app/wait-for-it.sh kafka:29092 --timeout=60 --strict -- && \
      pip install --no-cache-dir kafka-python && \
      python producer.py"

  # Data generator to create sample data
  data-generator:
    image: confluentinc/cp-kafka:7.3.0
    container_name: data-generator
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parcel-net
    command: >
      sh -c "
      echo 'Waiting for Kafka...' &&
      sleep 30 &&
      echo 'Creating Kafka topics...' &&
      kafka-topics --create --topic gps --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic temperature --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic battery --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      echo 'Topics created successfully' &&
      tail -f /dev/null
      "

  spark-processor:
    image: jupyter/pyspark-notebook
    container_name: spark-processor
    ports:
      - "4041:4040"
    depends_on:
      - kafka
      - postgres
      - data-generator
    networks:
      - parcel-net
    volumes:
      - ./process.py:/app/process.py
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPICS=gps,temperature,battery
    command: >
      sh -c "
      echo 'Waiting for services...' &&
      sleep 45 &&
      pip install kafka-python==2.0.2 &&
      spark-submit \
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.5.0 \
      /app/process.py
      "

  spark-notebook:
    image: jupyter/pyspark-notebook
    container_name: spark-notebook
    ports:
      - "8888:8888"
      - "4042:4040"
    depends_on:
      - kafka
      - postgres
    networks:
      - parcel-net
    environment:
      SPARK_OPTS: "--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.5.0"
    volumes:
      - .:/home/jovyan/work

networks:
  parcel-net:
    driver: bridge
