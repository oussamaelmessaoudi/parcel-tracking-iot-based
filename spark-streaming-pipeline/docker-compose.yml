version: '3.7'
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    networks:
      - parcel-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - parcel-net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --list --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Data generator to create sample data
  data-generator:
    image: confluentinc/cp-kafka:7.3.0
    container_name: data-generator
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - parcel-net
    command: >
      sh -c "
      echo 'Waiting for Kafka...' &&
      sleep 30 &&
      echo 'Creating Kafka topics...' &&
      kafka-topics --create --topic gps --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic temperature --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic battery --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092 &&
      echo 'Topics created successfully' &&
      tail -f /dev/null
      "
  # Ajoutez ce service à votre docker-compose.yml existant

  # Producer MongoDB Atlas → Kafka
  mongodproducerb-:
    image: jupyter/pyspark-notebook
    container_name: mongodb-producer
    depends_on:
      - kafka
      - data-generator
    networks:
      - parcel-net
    environment:
      - MONGODB_URI=mongodb+srv://fatimazahraboukamar23_db_user:QTLfmphbMT8UvbDb@iotcluster.yv9yxtt.mongodb.net/tracksecure?retryWrites=true&w=majority
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - .:/home/jovyan/work
    command: >
      sh -c "
      echo 'Waiting for Kafka and MongoDB...' &&
      sleep 40 &&
      echo 'Installing dependencies...' &&
      pip install kafka-python pymongo &&
      echo 'Starting MongoDB Atlas to Kafka Producer...' &&
      python /home/jovyan/work/producer_mongodb.py
      "

  spark-processor:
    image: jupyter/pyspark-notebook
    container_name: spark-processor
    ports:
      - "4041:4040"
    depends_on:
      - kafka
      - data-generator
    networks:
      - parcel-net
    volumes:
      - ./process.py:/app/process.py
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPICS=gps,temperature,battery
      - MONGODB_URI=mongodb+srv://fatimazahraboukamar23_db_user:QTLfmphbMT8UvbDb@iotcluster.yv9yxtt.mongodb.net/tracksecure?retryWrites=true&w=majority
      - MONGODB_DATABASE=tracksecure
      - MONGODB_PROC_COLLECTION=processed_predictions
    command: >
      sh -c "
      echo 'Waiting for services...' &&
      sleep 45 &&
      pip install kafka-python==2.0.2 pymongo &&
      spark-submit \
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.mongodb.spark:mongo-spark-connector_2.12:3.0.1 \
      /app/process.py
      "

  spark-notebook:
    image: jupyter/pyspark-notebook
    container_name: spark-notebook
    ports:
      - "8888:8888"
      - "4042:4040"
    depends_on:
      - kafka
    networks:
      - parcel-net
    environment:
      SPARK_OPTS: "--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.mongodb.spark:mongo-spark-connector_2.12:3.0.1"
    volumes:
      - .:/home/jovyan/work

networks:
  parcel-net:
    driver: bridge