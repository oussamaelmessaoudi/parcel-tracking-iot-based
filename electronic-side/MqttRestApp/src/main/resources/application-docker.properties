spring.application.name=MqttRestApp
server.port=8081

# Kafka Configuration for Docker
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=tracking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
kafka.topic.sensor-data=sensor-data

# MQTT Configuration for Docker
mqtt.broker.url=tcp://mosquitto:1883
mqtt.broker.username=oussama
mqtt.broker.password=123456
mqtt.client.id=springbootClient

# SSL truststore
javax.net.ssl.trustStore=classpath:truststore.jks
javax.net.ssl.trustStorePassword=123456


# spring.security.oauth2.client.provider.keycloak.issuer-uri is correct (internal Docker network access)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/parcel-tracking-auth

# Use localhost:8080 for the redirect URI (external host machine access)
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8081/login/oauth2/code/keycloak