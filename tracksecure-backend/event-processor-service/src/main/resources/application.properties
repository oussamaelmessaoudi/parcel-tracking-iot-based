spring.application.name=event-processor-service
server.port=8086

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=event-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.enable-auto-commit=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# Kafka Streams
spring.kafka.streams.application-id=event-processor-streams
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$ByteArraySerde
spring.kafka.streams.properties.commit.interval.ms=1000

# Kafka Topics
kafka.topic.tracking-events=tracking-events
kafka.topic.processed-events=processed-events
kafka.topic.invalid-events=invalid-events
kafka.topic.anomaly-events=anomaly-events
kafka.topic.enriched-events=enriched-events
kafka.topic.high-priority-events=high-priority-events

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# Logging
logging.level.root=INFO
logging.level.com.tracksecure.processor=DEBUG
logging.level.org.apache.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Actuator (optional)
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
