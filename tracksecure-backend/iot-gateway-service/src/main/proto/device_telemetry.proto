syntax = "proto3";

package com.tracksecure.proto;

option java_package = "com.tracksecure.proto";
option java_outer_classname = "DeviceTelemetryProto";

message DeviceTelemetry{
  string device_id = 1;
  int64  timestamp = 2;
  SensorData sensor_data = 3;
}

message SensorData{
  DhtData dht_data = 1;
  GpsData gps_data = 2;
}

message DhtData{
  double temperature = 1;
  double humidity = 2;
}

message GpsData{
  double longitude = 1;
  double latitude = 2;
  int32 satellites = 3;
}
