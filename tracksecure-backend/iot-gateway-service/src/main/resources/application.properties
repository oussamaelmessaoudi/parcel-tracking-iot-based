spring.application.name=iot-gateway-service
server.port=8084

# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=iot-gateway-service
mqtt.username=
mqtt.password=
mqtt.topics=devices/+/location,devices/+/telemetry,devices/+/events
mqtt.qos=1
mqtt.connection.timeout=30
mqtt.keepalive.interval=60
mqtt.clean.session=true
mqtt.automatic.reconnect=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.max.in.flight.request.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Topics
kafka.topic.tracking-events=tracking-events

# Logging
logging.level.root=INFO
logging.level.com.tracksecure.iotgatewayservice=DEBUG
logging.level.org.springframework.integration.mqtt=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Async Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100